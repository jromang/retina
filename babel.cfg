# Extraction of the translatable strings of the Python domain (pybabel).
#
# Two keywords, and no `_`: the repository already uses `_` as a throwaway variable, so a loop
# would reassign the translation function. See the header of `python/retina/i18n.py`.
#
#   `_t(...)`  translates immediately  — preprocessing notes, progress messages;
#   `N_(...)`  marks without translating — parameter labels, translated at serialization time.
#
# The frontend is NOT extracted here: its catalogs are `web/messages/{en,fr}.json`, compiled by
# Paraglide. Two toolchains, two worlds, no ambiguity about who owns what.
# The pattern is relative to the **input directory** passed to `pybabel extract` (here
# `python/retina`), and not to the repository root. Written from the root, it captured no file
# at all — and the extraction returned an empty template without the slightest warning.
[python: **.py]

