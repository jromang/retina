[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "retina"
version = "0.0.3"
description = "Retina — open-source, fully scriptable astrophotography image processing"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 form: SPDX expression + files. The old `{ text = ... }` table is deprecated, and
# briefcase refuses to package without `license-files` (it copies the license into the bundle).
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jean-Francois Romang", email = "jromang@protonmail.com" }]
keywords = ["astrophotography", "astronomy", "image-processing", "fits", "xisf", "deconvolution"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Image Processing",
]

urls = { Homepage = "https://github.com/jromang/retina", Repository = "https://github.com/jromang/retina", Issues = "https://github.com/jromang/retina/issues" }
dependencies = [
    "numpy>=1.24",
    "astropy>=6.0",
    "asteval>=1.0",  # sandboxed Python evaluation for PixelMath (no home-grown language)
    "PyYAML>=6.0",   # frontmatter of the process docs (headless reading, without a shell)
]

[project.optional-dependencies]
# Web shell (VS Code-style TypeScript frontend) — a plain CLIENT of the scriptable API, and the
# project's only shell since the Qt shell was removed. Optional: `import retina` must not pull
# it in (checked by tests/server/test_headless_parity.py).
web = [
    "aiohttp>=3.11",   # a single server for HTTP + WebSocket, on loopback
    "ipython>=8",      # console: embedded InteractiveShell (completion, history, magics)
    "markdown>=3.10.2",           # Markdown→HTML rendering of the process docs
    "pymdown-extensions>=11.0.1",  # arithmatex extension (LaTeX math → KaTeX)
    "pygments>=2.15",          # syntax highlighting of the doc's code blocks
    "pillow>=10",              # MCP server: renders a view as PNG so the agent can see it
]
# Astro ecosystem (calibration, stacking, background, stars, deconvolution…). Wrapped as Process.
astro = [
    "scipy>=1.11",
    "scikit-image>=0.22",
    "photutils>=1.10",
    "ccdproc>=2.4",
    "astroalign>=2.5",
    "astroscrappy>=1.1",
    "colour-demosaicing>=0.2",
    "astroquery>=0.4",  # online plate-solving (Astrometry.net) + catalogs
    "astrometry>=4.0",  # OFFLINE plate-solving (astrometry.net engine, pure Python)
    "matplotlib>=3.7",  # required by colour; otherwise a Mock pollutes sys.modules
    "pillow>=10",       # rendering of catalog annotation markers and labels
    "reproject>=0.13",  # WCS-based mosaicking (reproject_interp / reproject_and_coadd)
    "sep>=1.4.1",         # very fast background + source detection (Source-Extractor)
    "PyWavelets>=1.4",  # decimated/undecimated wavelets (WaveletDenoise, denoise_wavelet)
    "rawpy>=0.19",      # camera RAW loading (.cr2/.nef/.arw/.dng…)
    "opencv-python-headless>=4.8",  # fast NLM, inpaint, seamless clone, ORB (headless variant)
    "scikit-learn>=1.3",  # PCA/ICA: component separation / channel decorrelation
    # These three used to arrive **transitively** through scikit-image, and io/raster.py imports
    # them directly: a dependency resolution that stopped pulling them in would break TIFF/PNG
    # export silently. We declare what we consume.
    "tifffile>=2023.7",  # 32-bit float TIFF (the only raster format that preserves our data)
    "imageio>=2.31",     # 8-bit PNG/JPEG/BMP/WebP
    "jplephem>=2.21",    # JPL DE kernels (EphemerisGenerator, kernel="de440s")
    # JPEG XL: 6 MB, and wheels for cp310→cp314 on macOS (x86_64 + arm64), manylinux
    # (x86_64/aarch64/i686), musllinux and Windows (32/64/arm64) — better coverage than several
    # packages already listed here. A separate extra was not justified, and above all it would
    # have prevented **opening** a .jxl received from someone else, which is more of a nuisance
    # than not being able to write one.
    "pillow-jxl-plugin>=1.2",
]
# `astro` minus `astrometry`, which does not compile under MSVC -- the very reason ASTAP exists
# on Windows. Two consumers point here rather than each keeping their own copy: the Windows CI
# job, and the briefcase `requires` list further down. tests/test_packaging_manifest.py asserts
# they stay in step, because the invariant used to be a paragraph and paragraphs drift.
astro-msvc = [
    "scipy>=1.11",
    "scikit-image>=0.22",
    "photutils>=1.10",
    "ccdproc>=2.4",
    "astroalign>=2.5",
    "astroscrappy>=1.1",
    "colour-demosaicing>=0.2",
    "astroquery>=0.4",
    "matplotlib>=3.7",
    "pillow>=10",
    "reproject>=0.13",
    "sep>=1.4.1",
    "PyWavelets>=1.4",
    "rawpy>=0.19",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "tifffile>=2023.7",
    "imageio>=2.31",
    "jplephem>=2.21",
    "pillow-jxl-plugin>=1.2",
]
# AI star removal, denoising and deconvolution (StarNet/GraXpert ONNX models).
# `onnx` is not needed at runtime -- onnxruntime loads the model -- but the tests build tiny
# models on the fly to exercise the runtime without downloading 218 MB. Without it, 14 tests
# skip silently, which is exactly the failure mode the CI environment assertion exists to
# catch: it did, on the first run.
ai = ["onnxruntime>=1.16"]
# Optional GPU acceleration (NVIDIA). The Rust core remains the reference CPU path, and every
# ported process falls back on it silently when CuPy is missing (cf. backend/xp.py).
#
# **Why an extra and not a dependency of `astro`**: the CuPy wheel is tied to a **CUDA branch**
# (two distinct packages), and no PEP 508 marker allows conditioning on the driver version — pip
# therefore cannot choose on our behalf. It moreover exists **only** for Linux (x86_64, aarch64)
# and Windows amd64: putting it in the install line would make `pip install` fail on macOS, plain
# and simple.
#
# `cuda` = CUDA 13, the current branch (and the only one covering Blackwell cards, sm_120);
# `cuda12` remains for an older driver.
#
# The `>=13` floor below stays where it is, and Dependabot's offer to raise it is declined on
# purpose: this extra exists *for* the people held on an older driver, so its floor is the
# feature, not lag. Nothing here can test a CUDA 12 stack anyway -- the development machine runs
# cupy-cuda13x -- so raising it would trade a reachable configuration for an unverified claim.
cuda = ["cupy-cuda13x>=14"]
cuda12 = ["cupy-cuda12x>=13"]
# Native XISF format.
xisf = ["xisf>=0.9"]
# Projects (.retina): a single HDF5 file per project — windows, previews, masks and **all** the
# history states, chunked and compressed. Lazy import: `import retina` must not pull in h5py
# (checked by tests/server/test_headless_parity.py).
project = ["h5py>=3.10"]
# Babel is NOT a runtime dependency: the domain translates with `gettext`, which is in the
# standard library, and falls back on English when a catalog is missing. Babel serves only to
# extract and compile the catalogs (`scripts/update_translations.py`), in development.
# `onnx` is here rather than in [ai] because nothing needs it at runtime: onnxruntime
# loads the model. The tests build tiny models on the fly to exercise the runtime
# without downloading 218 MB, which is a test concern.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.5", "mypy>=1.10", "babel>=2.14",
       "onnx>=1.15"]
# Packaging toolchain. Kept apart from `dev`: it pulls in a heavy tool nobody needs in order to
# develop or run the tests. See the [tool.briefcase] section for the pre-steps.
packaging = ["briefcase>=0.3.20"]

[project.scripts]
retina = "retina.run:main"

