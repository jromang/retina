[tool.maturin]
python-source = "python"
manifest-path = "crates/retina_core/Cargo.toml"
module-name = "retina._core"
features = ["pyo3/extension-module"]
# Non-.py package data: process docs (Markdown), viewer assets (KaTeX/CSS) and SVG icons —
# embedded in the wheel so that everything works offline.
include = [
    { path = "python/retina/resources/**/*", format = ["sdist", "wheel"] },
]

# ---------------------------------------------------------------------------
# Application packaging (briefcase). Briefcase has NO pre-build hook: the non-Python artifacts
# must exist BEFORE `briefcase create`. Three steps, in this order:
#   1. python scripts/build_dist.py       # Vite frontend → resources/webui/, shell → retina/shell/
#   2. python scripts/fetch_astap.py      # fills vendor/astap/<platform> (bundled via `sources`)
#   3. maturin develop --release          # drops retina/_core.pyd INTO the source tree
# then:  briefcase create && briefcase build && briefcase package
#
# A single mechanism carries everything: `sources = ["python/retina"]`. The three non-Python
# artifacts (frontend, native shell, Rust core) live *inside* `python/retina/`, so no additional
# packaging rule is necessary — this is deliberate, do not move them elsewhere.
# `maturin develop` (and not `build`) precisely for that: `build` produces a wheel, which
# briefcase would not know where to pick up. `_core` is built as abi3-py311, hence compatible
# with the Python briefcase embeds whatever its version, as long as it is ≥ 3.11.
#
# Verified end to end on Windows (2026-07): a **272 MB** MSI (≈790 MB installed, in
# `%LOCALAPPDATA%\Programs\<author>\Retina\`), and the installed executable starts the server and
# its native window. The entry point is `python -m retina`, imposed by briefcase
# (`AppConfig.main_module()` returns `module_name` hard-coded) — hence `python/retina/__main__.py`.
#
# The smoke test that counts is NOT "the window opens": it is applying a process from each family
# in the **installed** app, through its MCP server (persistent token from
# `%APPDATA%\retina\mcp-token`, `X-Retina-Token` header, `open_images` / `apply_process` /
# `execute_python` tools). That is what revealed that the bundle started without its astro
# ecosystem.
# ---------------------------------------------------------------------------
[tool.briefcase]
project_name = "Retina"
bundle = "org.retina"
version = "0.0.3"
url = "https://github.com/jromang/retina"
license = "GPL-3.0-or-later"
author = "jromang"
author_email = "jromang@protonmail.com"

[tool.briefcase.app.retina]
formal_name = "Retina"
description = "Astrophotography image processing, fully scriptable in Python"
sources = ["python/retina"]
# Briefcase completes the extension according to the platform: `.ico` (Windows), `.icns`
# (macOS), `-<size>.png` (Linux). All three forms are produced by `scripts/gen_icons.py`.
# Without this line, the template drops its own default icon.
icon = "python/retina/resources/branding/retina"
# The entry point of the packaged application is `python -m retina`, that is,
# `python/retina/__main__.py`. This is NOT configurable: `AppConfig.main_module()` returns
# `module_name` hard-coded. Hence the existence of `__main__.py`, which delegates to the web
# shell.
# The domain, plus the web shell (server + IPython console + doc rendering). No native GUI
# dependency: the UI is HTML served by aiohttp and displayed by the webview.
#
# **The astro ecosystem is part of the bundle, and that is not negotiable.** The processes import
# scipy/skimage/photutils *lazily*, inside their method bodies: without those wheels, the
# application starts, displays all of its processes… and each one fails with a
# `ModuleNotFoundError` the moment it is executed. A bundle that only knows how to open itself is
# not a bundle. The price is size (~2× the MSI); paying it is the only choice consistent with a
# distribution aimed at users who do not have a Python toolchain.
requires = [
    "numpy>=1.24", "astropy>=6.0", "asteval>=1.0", "PyYAML>=6.0", "xisf>=0.9",
    "aiohttp>=3.11", "ipython>=8",
    "markdown>=3.10.2", "pymdown-extensions>=11.0.1", "pygments>=2.15",
    "pillow>=10",
    # .retina projects (HDF5). Without it, opening or saving a project raises a RuntimeError.
    "h5py>=3.10",
    # --- astro ecosystem: mirror of the [astro] extra, with one exception ---
    # `astrometry` is deliberately ABSENT from it: the package does not compile under MSVC. On
    # Windows it is ASTAP that provides offline plate-solving (the .windows section below); the
    # .linux / .macOS sections reintroduce it.
    "scipy>=1.11", "scikit-image>=0.22", "photutils>=1.10", "ccdproc>=2.4",
    "astroalign>=2.5", "astroscrappy>=1.1", "colour-demosaicing>=0.2",
    "astroquery>=0.4", "matplotlib>=3.7", "reproject>=0.13", "sep>=1.4.1",
    "PyWavelets>=1.4", "rawpy>=0.19", "opencv-python-headless>=4.8",
    "scikit-learn>=1.3", "tifffile>=2023.7", "imageio>=2.31", "jplephem>=2.21",
    "pillow-jxl-plugin>=1.2",
    # AI star removal, denoising and deconvolution. Without it those processes appear in the
    # catalog and die on first use -- which is what the bundle smoke test caught.
    "onnxruntime>=1.16",
]

[tool.briefcase.app.retina.windows]
# ASTAP = OFFLINE astrometric solver on Windows. The vendor/astap source is copied verbatim
# into the bundle (populated beforehand by scripts/fetch_astap.py). _find_astap() locates it
# next to the retina package in the packaged app.
sources = ["vendor/astap"]

# Version of the Python runtime embedded in the MSI. Without this line, briefcase takes the
# `support_revision` of its template (4 → Python 3.14.4), INDEPENDENTLY of the dev Python: the
# MSI thus embedded 3.14.4 while the venv was on 3.14.6. It is therefore pinned here, so that the
# distributed version is declared rather than inherited by accident.
#
# 3.14.6 is also what moves OpenSSL off the 3.0 branch: `libssl-3.dll`/`libcrypto-3.dll` come
# from the SAME zip as `python314.dll`, and CPython 3.14.6 is built against OpenSSL 3.5.7 (the
# LTS branch), whereas 3.14.5 was still on 3.0.20. A single number governs both — so THIS is the
# line to move at the next Python *or* OpenSSL CVE.
#
# The URL built is python.org/ftp/python/3.14.6/python-3.14.6-embed-amd64.zip: the `3.14` comes
# from the Python that RUNS briefcase, the `6` from here. Keep the dev venv on the same minor.
# Pitfall: briefcase does not re-download as long as `build/retina/windows/` exists — it has to
# be deleted (or renamed) before `briefcase create windows`, otherwise moving this number changes
# NOTHING and the MSI produced looks fixed without being so. (`create -r` does not exist in
# 0.4.4.)
# The generated `briefcase.toml` keeps displaying the template's `support_revision`: that is
# normal, the pin here wins at download time. The verification that is authoritative is the
# ProductVersion of the DLLs in `build/retina/windows/app/src/`.
# Windows only: elsewhere the support package is a BeeWare artifact (`…-support.b<N>.tar.gz`)
# whose revision is nothing like a python.org micro version — putting "6" there would break
# Linux/macOS.
support_revision = "6"

# Off Windows, the `astrometry` package (astrometry.net engine, pure Python) compiles and
# provides offline plate-solving without ASTAP. Briefcase accumulates the app + platform
# `requires`, so these two lines add to the list above instead of replacing it.
[tool.briefcase.app.retina.linux]
requires = ["astrometry>=4.0"]

[tool.briefcase.app.retina.macOS]
requires = ["astrometry>=4.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The recipes are executed by retina.run with `app` and `retina` injected into the namespace:
# they are not importable modules, so they are excluded from static linting.
extend-exclude = ["tests/recipes"]

[tool.ruff.lint]
# Characters the codebase uses on purpose, so RUF001-003 stay on. Em dash and arrow are load
# bearing in the docstrings; the rest are mathematical notation in the algorithm comments.
allowed-confusables = [
    "—", "–", "→", "·", "×", "≈", "≥", "≤", "−", "′",        # punctuation and notation
    "σ", "α", "β", "µ", "λ", "Σ", "Δ",                        # Greek, in the algorithm prose
]
# An EXPLICIT selection, and that matters: without it, ruff applies its defaults, which change
# from one version to the next. Moving to ruff 0.16 thus surfaced ~300 diagnostics at once on
# unchanged code (413 rules enabled instead of the 4 historical families). Pinning the rule set
# makes upgrading ruff free of surprises.
select = [
    "E",    # pycodestyle — errors
    "W",    # pycodestyle — warnings
    "F",    # pyflakes — real defects (undefined names, dead imports)
    "I",    # isort — import ordering
    "UP",   # pyupgrade — idioms obsolete with respect to requires-python
    "B",    # flake8-bugbear — classic traps
    "C4",   # comprehensions
    "SIM",  # readable simplifications
    "RUF",  # ruff's own rules
]
ignore = [
    # `parameters = [Parameter(...), ...]` is a process's **parameter table**: a class schema,
    # shared and never mutated (verified: no mutation anywhere in the repository). Annotating it
    # `ClassVar` in all 115 processes would be 120 lines of noise to document an intent the
    # object model already states.
    "RUF012",
    # `int(round(x))` remains necessary: `round()` on a numpy scalar returns a numpy scalar, not
    # an `int`. The proposed "simplification" would change the return type.
    "RUF046",
    # RUF001/002/003 ("ambiguous" Unicode) are deliberately NOT ignored. They hunt homoglyphs —
    # the Cyrillic "а" disguised as a Latin "a" — and, now that the source is English
    # throughout, they double as a permanent guard against French typography creeping back into
    # a literal, a docstring or a comment. The punctuation the codebase legitimately uses is
    # declared in `allowed-confusables` below instead of switching the rules off.
]

# The recipes and test scripts allow themselves shortcuts the package does not.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]  # `pytest.raises(Exception)` is sometimes the exact contract to check

[tool.pytest.ini_options]
testpaths = ["tests"]
# The web shell tests are asynchronous (aiohttp client); auto mode avoids having to decorate
# every test. The rest of the suite, which is synchronous, is unaffected.
asyncio_mode = "auto"
# `gpu`: numerical parity against the REAL CuPy. These tests skip themselves without a card
# (importorskip + getDeviceCount); the marker exists to run or exclude them on demand
# (`pytest -m gpu`, `pytest -m "not gpu"`).
markers = ["gpu: requires a CUDA GPU and CuPy installed"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # third-party dependency noise (colour-demosaicing imports a deprecated scipy API)
    "ignore:.*scipy.ndimage.filters.*:DeprecationWarning",
    "ignore::UserWarning:colour",
    # `Completer.complete` has been announced as deprecated since IPython 6.0 (2017) and is
    # still there in 9.x; its replacement `completions()` is *provisional*. See
    # server/console.py.
    "ignore:.*is pending deprecation since IPython.*:PendingDeprecationWarning",
]
