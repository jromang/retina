<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The `lang` attribute above is a fallback value: `src/shell/locale.ts` rewrites it as
         soon as the language is resolved, before the first render. It is English because that
         is the base language of the catalogs (`project.inlang/settings.json`). -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Served from web/public/, regenerated by scripts/gen_icons.py. The title bar displays
         the same file, rather than a second asset to keep in sync. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Retina</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
